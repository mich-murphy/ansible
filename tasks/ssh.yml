---
- name: ensure .ssh directory exists
  file:
    dest: "/home/{{ username }}/.ssh"
    mode: 0700
    state: directory
    owner: "{{ username }}"
    group: wheel

- name: set authorized key from github
  authorized_key:
    user: "{{ username }}"
    state: present
    key: https://github.com/mich-murphy.keys
